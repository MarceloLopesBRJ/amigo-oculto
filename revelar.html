<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Amigo Oculto</title>

<style>

body{

    margin:0;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    font-family:Arial,sans-serif;

    background:
linear-gradient(
135deg,
#14532d,
#22c55e
);

    color:white;

    padding:20px;
}

.card{

    max-width:500px;

    width:100%;

    background:white;

    color:#111;

    border-radius:20px;

    padding:30px;

    text-align:center;

    box-shadow:
    0 10px 30px
    rgba(0,0,0,.3);
}

button{

    background:#16a34a;

    color:white;

    border:none;

    border-radius:10px;

    padding:15px 30px;

    font-size:18px;

    cursor:pointer;
}

#resultado{

    margin-top:25px;

    font-size:32px;

    font-weight:bold;

    color:#16a34a;
}

</style>

</head>

<body>

<div class="card">

<h1>🎁 Amigo Oculto 🎁</h1>

<p id="pessoa"></p>

<p>

Preparado para descobrir quem você tirou?

</p>

<button onclick="revelar()">

Revelar Agora

</button>

<div id="resultado"></div>

</div>

<script>

const parametros =
new URLSearchParams(
window.location.search
);

const nome =
parametros.get("nome");

const amigo =
parametros.get("amigo");

document
.getElementById("pessoa")
.innerText =
nome ?
`Olá, ${nome}! 😄`
:
"Olá! 😄";

function revelar(){

    document
.getElementById("resultado")
.innerHTML =

"🎉 VOCÊ TIROU 🎉<br><br>" +
amigo +
"<br><br>🎁";

}

</script>

</body>
</html>
